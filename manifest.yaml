# 通天河 编译清单：钉上游版本 + 类别定义。
#
# 上游已钉到 commit SHA（2026-06-10 初次钉定）。bump：把对应 commit 换成新的 SHA/tag；
# rollback：换回旧 SHA。占位符 / 滚动分支(master/main/...) 会被 Manifest.Validate() fail-fast 挡住。
#
# repo / base_url 是自有产物仓库 + jsdelivr 基址（cutover 时订阅模板引用）。
# 解析器与上游的对应见 README「选定的源头」。

repo: "river2heaven/tongtian"
# cutover 时把 <TAG> 换成具体 ruleset-YYYYMMDD-HHMM tag（可回退）；或用 @ruleset-dist 取滚动最新
base_url: "https://cdn.jsdelivr.net/gh/river2heaven/tongtian@<TAG>/dist"

upstreams:
  # —— Tier 1 骨架 ——
  domain-list-community:
    repo: v2fly/domain-list-community
    commit: "76199d8e61d348c58433e3c36d9d4f85131d80e7"
    data_dir: data                       # 设了 data_dir = geosite 上游
  dnsmasq-china-list:
    repo: felixonmars/dnsmasq-china-list
    commit: "d87a5bc1d76b87a6729e9e5355c35be0fc2ff6cd"
    files: [accelerated-domains.china.conf]
  # 同 repo 同 SHA，只取 apple.china.conf。上游把 Apple 的中国 CDN 域名**独立成文件**
  # （不并入 accelerated-domains.china.conf），是刻意的策略分离：Apple 中国区 CDN 该不该走
  # 国内解析/直连，牵涉 App Store / iCloud / Siri 等账号敏感服务，并非所有消费端都要。
  # 故本层同样单列类别（见 categories.apple-cn），不混进 cn。
  # ⚠ commit 必须与 dnsmasq-china-list 一致 —— Validate 有守卫（同 repo 多 key 必须同 SHA）。
  dnsmasq-china-list-apple:
    repo: felixonmars/dnsmasq-china-list
    commit: "d87a5bc1d76b87a6729e9e5355c35be0fc2ff6cd"
    files: [apple.china.conf]
  gfwlist:                               # GFW 一手源头（base64 AutoProxy）
    repo: gfwlist/gfwlist
    commit: "e8e285a9b1597f47ff2f6f4d556f11eb0a810d30"
    files: [gfwlist.txt]
  chnroutes2:                            # GEOIP-CN 一手源（IP-CIDR）
    repo: misakaio/chnroutes2
    commit: "581f1f60b073aa53abfe3a5da45419a67b4a6708"
    files: [chnroutes.txt]

  # —— Tier 2 富化：广告 reject ——
  anti-ad:                               # CN 广告 reject 权威（纯域名）
    repo: privacy-protection-tools/anti-AD
    commit: "a8f65d8043940b20ba7ee75d402c60b885e547e6"
    files: [anti-ad-domains.txt]
  hagezi-pro:                            # 分级最细（onlydomains 纯域名）
    repo: hagezi/dns-blocklists
    commit: "78cf5b378eb35137026142165337373bd7c3d4c3"
    files: [wildcard/pro-onlydomains.txt]

  # —— Tier 2 富化：AI 长尾 cross-check ——
  # 注：VPSDance/ai-proxy-rules 是 per-provider YAML 源（无现成域名清单），不适配本编译器的
  # domainlist 解析器，暂不纳入；待其有合并产物或加 YAML 解析器再补。
  ai-fmz200:                             # 含 Anthropic/OpenAI 等长尾（DOMAIN/-SUFFIX/IP-CIDR）
    repo: fmz200/wool_scripts
    commit: "9c74d2bc3cea5c869f7a6c1b06571d285b4a3f78"
    files: [Loon/rule/AI.list]

# 类别 → 产物（每项产 <name>.list + <name>.singbox.json[+ .srs] + <name>.arrs[超 10k 跳过]）。
# 一个类别可引用多个输入源，编译器取并集 + 去重。
categories:
  # —— 冻结四类（geosite）——
  - name: netflix
    geosite: [netflix]
    exclude_attrs: [ads]
  - name: youtube
    geosite: [youtube]
    exclude_attrs: [ads]
  - name: github
    geosite: [github]
  - name: cloudflare
    geosite: [cloudflare]

  # —— CN 域名 + GEOIP-CN + GFW（新血统）——
  # cn = dnsmasq-china-list ∪ data/cn-extra.txt（仓内 curated 种子，补上游缺口，如 Bambu Lab）
  - name: cn
    chinalist: dnsmasq-china-list
    localdomains: data/cn-extra.txt
  - name: geoip-cn
    geoip: chnroutes2
  - name: gfw
    gfwlist: gfwlist

  # —— 大厂 ASN 全 IP（含海外接入段）→ IP 侧直连补充 ——
  # geoip-cn 只按「国别」收国内 IP，兜不住大厂的海外接入段（如腾讯 AS132203 的
  # 43.128.0.0/10：微信 mmtls 裸 IP 直连的日/美接入点）。此类别按 ASN 汇聚各大厂
  # 全部宣告 CIDR（含海外），供订阅端 `RULE-SET,china-company-ip,DIRECT`，让大厂 App
  # 的无域名 IP 连接直连（不落兜底代理 → 不再「国内服务显示海外属地 / 图片被风控」）。
  # 数据由 scripts/gen-china-company-ip.sh 从 ipverse/asn-ip 钉定 SHA 生成入仓
  # （data/china-company-ip.cidr 头部记 ASN 清单 + 源 SHA；ISP 骨干/无关公司已逐个 header 核对排除）。
  - name: china-company-ip
    localfile: data/china-company-ip.cidr

  # —— AI：dlc category-ai-!cn（dlc 官方"全部非中国 AI"聚合，include 展开 20+ 厂商：
  #    anthropic/openai/perplexity/xai(grok)/github-copilot/cursor/windsurf/poe/groq/
  #    huggingface/cohere/cerebras/elevenlabs/deepmind...）+ gemini 补全 + fmz200 长尾，合并去重。
  # category-ai-!cn 的 include 不含 gemini，故单列 google-gemini；bard 已被上游删（Bard→Gemini）。
  - name: ai
    geosite: ["category-ai-!cn", google-gemini]
    exclude_attrs: [ads]
    domainlists: [ai-fmz200]

  # —— 广告 reject：anti-AD + hagezi 合并去重，再减去 curated 白名单 ——
  # 白名单修上游误杀：广告库为拦 App 内嵌广告，常把该 App 的媒体 CDN / 核心服务
  # 一并收录，表现为图片/媒体加载不出（详见 data/reject-allowlist.txt 头部）。
  - name: reject
    domainlists: [anti-ad, hagezi-pro]
    exclude_domains: data/reject-allowlist.txt

  # —— 流媒体 / 社交（geosite）——
  - name: disney
    geosite: [disney]
  - name: telegram
    geosite: [telegram]
  - name: twitter
    geosite: [twitter]

  # —— 账号体系边界类别（2026-08-19）——
  # 动因：规则集按「服务类型」切，而账号会话按「服务商」划，两个维度不对齐。
  # 典型：gemini 归 ai、accounts/www.google 归 gfw、youtube 归 youtube —— 同一个
  # Google 账号被拆到三个类别；消费端若把它们指向不同出口，同一会话即出现多个源 IP，
  # 触发风控（实测：Gemini 报「异常流量」并列出两个不相等的 IP）。同理 grok.x.com /
  # x.ai 归 ai 而 x.com 归 twitter，同属一个 X 账号却被拆开。
  #
  # 解法：本层提供「按服务商聚合」的类别，消费端用规则顺序组合出所需边界。例如
  # `RULE-SET,youtube→A` 后接 `RULE-SET,google→B`，即把 YouTube 摘出、其余 Google
  # （含 gemini）归一处；`RULE-SET,xai` 与 `RULE-SET,twitter` 指同一组，即让 grok 与
  # x.com 同出口。**纯加法**：ai / twitter / youtube 三个既有类别不变，不使用者零影响。
  #
  # ⚠ 上游 google 含 include:youtube 与 include:google-deepmind(=gemini)，故消费端若要
  #   YouTube 独立，youtube 规则必须排在 google 之前（Clash/mihomo 首次匹配生效）。
  - name: google
    geosite: [google]
    exclude_attrs: [ads]
  # xai = grok.com / grok.x.com / grokipedia.com / x.ai（上游 twitter 类别不含这些）
  - name: xai
    geosite: [xai]

  # —— Apple 中国 CDN（2026-08-26）——
  # 动因：Apple 的资源 CDN 域名散落且持续新增，落兜底代理即产生 GB 级本不必要的跨境流量。已实测两次：
  # `updates.cdn-apple.com` 单次 5.9GB（iPadOS 系统更新）、`sylvan.apple.com` 单小时 23.4GB
  # （macOS 航拍屏保 4K 视频，10 分钟 119 连接 ≈ 312Mbps 持续）。两次都是消费端在订阅模板里
  # **手工内联域名清单**、而清单漏了那个域名 —— 手工维护全量清单已被证伪，故收进本层用上游
  # 权威清单（apple.china.conf，钉定 SHA 版 163 条，社区长期维护）。
  #
  # ⚠ 语义边界：该清单原用途是 **DNS 分流**（这些域名用国内 DNS 解析），与「应该直连」高度
  # 重合但不等价；且全量含 apps/itunes/music/appleid/guzzoni(Siri) 等**账号敏感**服务。
  # 本层只做事实聚合出全量，**策略交消费端**：若只想放行下载/更新 CDN，在本类别之前用精确
  # 规则把交互类摘走（同 google/xai 的「规则顺序组合出边界」，见上）。**纯加法**：cn 类别不变。
  - name: apple-cn
    chinalist: dnsmasq-china-list-apple
